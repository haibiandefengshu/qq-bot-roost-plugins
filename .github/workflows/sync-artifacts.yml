name: Sync artifacts from merge

# 合并后只校验索引是否自洽；**不生成贡献者表、不注入署名、不推 main**。
# 2026-11-22 起投稿 PR 自带 build-index.mjs 生成的 index.json，合并后
# 正常情况下没有漂移。若旧规 PR 或人工漏重建导致漂移，这里发 warning，
# 由维护者开 PR 提交生成结果（分支保护不允许 bot 直推 main）。
#
# 和 pr-guard.yml 的分工：
#   pr-guard.yml    —— 投稿进来时拦风险（只读 PR 元数据，不执行 PR 代码）
#   ci.yml          —— 投稿时校验真实索引与维护者字段
#   本文件          —— 合并后复核产物（只在 main 上跑，不碰 PR 代码）
#
# 为什么仍用 push 事件而不是 pull_request closed：
#   1. 本仓用 merge-pr.mjs 重建提交（改 SHA 留住 author），PR 只能 closed 而非
#      merged，pull_request 的 merged 事件不触发；push 是唯一可靠的信号。
#   2. push 事件的 head_commit 是合并提交，能直接对照合并后的 main。
#
# 安全前提（改这个文件的人必须守住）：
#   1. 只 checkout main（可信代码），绝不 checkout PR 分支或执行投稿代码；
#      build-index.mjs 只读元信息、算哈希，不 import 插件逻辑。
#   2. 权限只给 contents: read + pull-requests: read；不挂 environment、
#      不引入任何 secret。
#   3. 【禁止给 actions/checkout 指定 token:】默认 GITHUB_TOKEN 足够；PAT /
#      GitHub App token 会让 push 触发新 run 并递归，必须重新设计防环守卫。

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-artifacts
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 校验索引
        run: |
          if node scripts/build-index.mjs --check; then
            echo '✓ 索引与插件目录一致'
            exit 0
          fi

          echo '::warning::main 上索引有漂移。本工作流不再自动推送，请人工重建并提交。'
          node scripts/build-index.mjs
          git diff --stat -- index.json || true
          echo '人工步骤：从最新 main 开干净检出 → node scripts/build-index.mjs → 把 index.json 提 PR 合并。'
          exit 0
